# `expected_fit` is a prediction recorded before any synthesis run, for later
# comparison with outcomes. The loader ignores it (strictMode = false), it is never
# shown to any agent, and it is not part of any cache key. Values:
#   good          - a Level 0 SubtypingChecker marker lattice can make C-1 ill-typed,
#                   and the natural type-error fix is the real fix
#   builtin_only  - only a built-in checker (e.g. Signedness) can flag it; the
#                   pipeline's built-in path is currently NullnessChecker-only
#   poor          - no Level 0 lattice flags it, or the fix it points to is wrong or
#                   blocked by the repair guards (negative control)
# Rationale per entry: docs/candidate_commits.md, "Expected fit".
#
# `expected_preflight` predicts the build-integration preflight outcome
# (Dockerization plan, section 7.4) at the entry's parent commit: "pass" or the
# expected reason code. Like `expected_fit`, it is recorded before preflight
# first runs and never shown to an agent. `expected_preflight_basis` says how
# blind the prediction is; see repos.yaml for the values. For every entry here
# it is "phase0_probes": Phase 0's scripted probes already ran checks P3-P5 at
# these parent commits (one per repository), so only P1, P2, P6 and the suite
# check are genuine predictions.
