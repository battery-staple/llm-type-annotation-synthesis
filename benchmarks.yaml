benchmarks:
  - id: "synthetic-id-swap"
    repo_url: "eval-repos/synthetic-id-swap"
    commit_hash: "4d49e20bb284ba1aabfd68bde775aa55bfb7c401"
    parent_hash: "56aa665aa4fc4a95ffe48e7e1972b4d4328c61c3"
    regression_test_class: "com.example.synthetic.TransferServiceTest"
    regression_test_method: "testTransferDebitsSourceAndCreditsDestination"
    description: "Conflation of source and destination account identifiers in TransferService."
    default_branch: "main"
    source_compatibility: "17"
    target_compatibility: "17"
    build:
      tool: "gradle"
      wrapper_executable: "./gradlew"
      subproject: ""
      compile_task: "compileJava"
      test_task: "test"
      checker_task: "checkerPass"
  - id: "cmsx-assignment-extension"
    repo_url: "eval-repos/cmsx"
    commit_hash: "be6f19da0008342cf559b66175fdf1acd3a02b0e"
    parent_hash: "7ee122ff1fee70414fd1c717a2f089955ccbec5a"
    regression_test_class: "cms.controller.persistence.AssignmentControllerImplTest"
    regression_test_method: "getSubmissionStatus_assignmentGraded_pastDue_hasExtension_accept"
    description: "Submissions with a valid extension must be ACCEPTed even after the due date when the assignment is graded; previously any graded assignment REJECTed outright."
    default_branch: "master"
    source_compatibility: "21"
    target_compatibility: "21"
    production_roots: ["src"]
    test_roots: ["test", "regression/src"]
    build:
      tool: "gradle"
      wrapper_executable: "./gradlew"
      subproject: ""
      compile_task: "compileJava"
      test_task: "test"
      checker_task: "checkerPass"
  - id: "jsqlparser-index-kind"
    repo_url: "eval-repos/JSqlParser"
    commit_hash: "d1dbca1776b9f19849b456b40ad21b1c2e6690d5"
    parent_hash: "84f780cd1ae9c9256c4750e7b6a43d037b8d5d9a"
    regression_test_class: "net.sf.jsqlparser.statement.create.IndexKindStateTest"
    regression_test_method: "replacingTypeRefreshesEveryPreviousClassification"
    description: "Index.setType only reclassified the index kind when the previous kind was OTHER, so replacing an existing type left a stale kind (e.g. UNIQUE after switching to a custom type)."
    default_branch: "master"
    source_compatibility: "11"
    target_compatibility: "11"
    build:
      tool: "gradle"
      wrapper_executable: "./gradlew"
      subproject: ""
      compile_task: "compileJava"
      test_task: "test"
      checker_task: "checkerPass"
