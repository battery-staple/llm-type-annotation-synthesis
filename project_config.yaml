# Global pipeline policy. Per-benchmark settings (repository, build tool,
# Java compatibility) live in benchmarks.yaml; machine-specific values come
# from the environment (JAVA_HOME, GRADLE_USER_HOME, CHECKERFRAMEWORK).
# Relative paths are resolved against this file's directory.

triage:
  mode: "crawler"
  manifest_file: "repos.yaml"
  # Commit scan depth per repository; default 20. Raise explicitly for large crawls.
  depth: 20
  # Maximum verified samples admitted downstream (not a scan cap): all non-root
  # crawled commits are still ingested and triaged.
  # limit: 1000
  # Concurrent whole per-commit crawler runners; default 1, crawler mode only.
  # Nested agent and build limits below are independent resource semaphores.
  # jobs: 1
  bugfix_threshold: 0.75

# Global process limits: nested independent semaphores within each commit
# pipeline. Agents are concurrent LLM calls (default 8); builds covers Gradle
# compile/test/Checker invocations (default 2). triage.jobs bounds whole runners.
concurrency:
  agents: 8
  builds: 2

# Whole-stage transient retries, applied to every stage by the orchestrator.
# `backoff_ms` is the exponential base: base << attempt gives 2s, 4s, 8s...
# `attempts: 1` disables retries (one execution per stage).
stage:
  attempts: 3
  backoff_ms: 1000

paths:
  eval_repos_dir: "eval-repos"
  database: "data/pipeline.db"

environment:
  # Blank means: inherit JAVA_HOME / GRADLE_USER_HOME from the process.
  java_home: ""
  gradle_user_home: ""
  # Blank means: use $CHECKERFRAMEWORK, else vendor/checker-framework-3.42.0.
  checker_framework_home: ""
  # Global defaults; a benchmark entry may override either value.
  source_compatibility: "17"
  target_compatibility: "17"

guardrails:
  mode: "lenient"

model:
  # The pipeline seeds its isolated OpenCode DB with the global account and
  # credential rows, so opencode-go/* routes resolve normally.
  default: "opencode-go/deepseek-v4.1-flash"
  triage: "opencode-go/deepseek-v4.1-flash"
  synthesis: "opencode-go/deepseek-v4.1-flash"
  application: "opencode-go/deepseek-v4.1-flash"
  repair: "opencode-go/deepseek-v4.1-flash"

agent:
  # Experiment profile: these are overrides of the code defaults (25/20/50).
  steps:
    synthesis: 100
    application: 200
    repair: 300
  timeout_ms: 900000
  max_checker_invocations: 20

sample:
  temperature: 0.0

synthesis:
  freedom_level: "level0"
  allowed_checkers: "all"
  # The single built-in processor an agent may choose when allowed_checkers is
  # "all" or "builtin_only". Never used as a silent fallback.
  builtin_checker: "org.checkerframework.checker.nullness.NullnessChecker"
  # Agent sessions (feedback rounds) per stage execution. Each failed session
  # gets the validation problems appended to the next session's prompt.
  retry_sessions: 3

# Agent sessions (feedback rounds) per application stage execution. Rejected
# edits are reset and the next session re-applies annotations from clean C-1.
application:
  retry_sessions: 3

checker:
  processor: "org.checkerframework.common.subtyping.SubtypingChecker"
  category: "custom_qualifier_hierarchy"

repair:
  local_variable_annotations: "frozen"
  internet_access: false
  # Feedback turns per repair execution. The effective bound is
  # min(retry_turns, agent.max_checker_invocations).
  retry_turns: 4

prompt:
  tell_non_triviality_error: false

cache:
  stages_dir: ".cache/stages"
  enabled: true

# Build-integration preflight between ingestion and triage (no LLM calls).
# Off by default; `pipeline run --preflight` turns it on for one run. A
# repository outside the supported envelope then ends with lifecycle status
# `unsupported` and a reason code (docs/dockerization_plan.md, section 7.3).
# `pipeline preflight` runs it on its own regardless of this setting.
preflight:
  enabled: false
  # P7: run the full test task at clean C-1 under the build timeout.
  suite_check: true

verification:
  scope: "full_suite"
  baseline: "none"
